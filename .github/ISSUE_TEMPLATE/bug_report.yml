name: Bug report
description: Report reproducible incorrect behaviour
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please keep the lamp or shutter disabled while reproducing unsafe output behaviour.
  - type: input
    id: version
    attributes:
      label: FART version
      placeholder: 2.2.1
    validations:
      required: true
  - type: dropdown
    id: output
    attributes:
      label: DMX out protocol
      options: [Open DMX, Art-Net, sACN, Not applicable]
    validations:
      required: true
  - type: dropdown
    id: input
    attributes:
      label: DMX in protocol
      options: [Art-Net, sACN, Not used]
    validations:
      required: true
  - type: dropdown
    id: dimmer
    attributes:
      label: Dimmer mode (Operator tab)
      options: [Manual, DMX in, Not applicable]
    validations:
      required: true
  - type: dropdown
    id: beam
    attributes:
      label: Beam mode (Operator tab)
      options: [Manual, Auto size, DMX passthrough, Not applicable]
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Fixture and channel mapping
      description: Include the fixture model, DMX mode, output and shadow/console patches (universe and start address), and the fixture type's channel offsets.
  - type: textarea
    id: psn
    attributes:
      label: PSN status
      description: Include the PSN counters from the Operator tab, and the PSN In tab's tracker table if relevant.
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
