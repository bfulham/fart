[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fart-followspot"
dynamic = ["version"]
description = "Fixture Aiming and Remote Tracking from OpenFollow PSN to DMX"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Brady Fulham" }]
dependencies = [
  "PySide6>=6.5,<7",
  "pyserial>=3.5,<4",
  "keyring>=24,<26",
]
keywords = ["PSN", "PosiStageNet", "OpenFollow", "Art-Net", "sACN", "DMX", "followspot", "lighting"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/bfulham/fart"
Repository = "https://github.com/bfulham/fart"
Issues = "https://github.com/bfulham/fart/issues"
Changelog = "https://github.com/bfulham/fart/blob/main/CHANGELOG.md"

[project.scripts]
fart = "fart.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "fart._version.APP_VERSION" }

[tool.setuptools.packages.find]
include = ["fart*"]
